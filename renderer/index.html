<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PoE Progression Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="pink">
  <div id="panel">
    <div id="main-col">
      <div id="header">
        <span id="title">🗡️ Progression Companion</span>
        <div id="header-actions">
          <button id="settings-collapse-btn" title="Show/hide the options above">▲</button>
          <button id="settings-btn" title="Edit (add/remove/reorder)">⚙</button>
          <button id="close-btn" title="Hide (Ctrl+Shift+L)">✕</button>
        </div>
      </div>

      <div id="settings-panel">
        <div id="build-row">
          <label for="build-select">Build</label>
          <select id="build-select"></select>
          <button id="add-build-btn" title="New build">+</button>
          <button id="clear-build-btn" title="Uncheck all items in this build">🗑</button>
        </div>
        <div id="build-add-form" class="hidden">
          <input id="build-name-input" type="text" placeholder="Build name">
          <button id="build-confirm-btn">✓</button>
        </div>
        <div id="theme-row">
          <label for="theme-select">Theme</label>
          <select id="theme-select">
            <option value="pink">Gold</option>
            <option value="white">Crimson</option>
            <option value="gray">Gray</option>
            <option value="green">Void</option>
            <option value="blue">Blue</option>
          </select>
        </div>
        <div id="import-row">
          <label for="import-url-input">Import</label>
          <input id="import-url-input" type="text" placeholder="pobb.in/... or pastebin.com/...">
          <button id="import-build-btn" title="Import leveling sections from a build link">Go</button>
        </div>
        <div id="import-status"></div>

        <div id="hotkey-row">
          <label for="hotkey-input">Hotkey</label>
          <input id="hotkey-input" type="text" readonly value="Control+Shift+L">
          <button id="hotkey-record-btn" title="Click, then press a key combo">Set</button>
        </div>
        <div id="hotkey-status"></div>

        <div id="add-section-row">
          <label for="new-section-input">Section</label>
          <input id="new-section-input" type="text" placeholder="Section name">
          <button id="add-section-btn">+</button>
        </div>
      </div>

      <div id="sections"></div>

      <div id="hint">Ctrl+Shift+L to show/hide</div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
