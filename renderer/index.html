<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PoE League Checklist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="pink">
  <div id="panel">
    <div id="main-col">
      <div id="header">
        <span id="title">🗡️ League Checklist</span>
        <div id="header-actions">
          <button id="settings-btn" title="Edit (add/remove/reorder)">⚙</button>
          <button id="close-btn" title="Hide (Ctrl+Shift+L)">✕</button>
        </div>
      </div>

      <div id="settings-panel">
        <div id="build-row">
          <label for="build-select">Build</label>
          <select id="build-select"></select>
          <button id="add-build-btn" title="New build">+</button>
        </div>
        <div id="build-add-form" class="hidden">
          <input id="build-name-input" type="text" placeholder="Build name">
          <button id="build-confirm-btn">✓</button>
        </div>
        <div id="theme-row">
          <label for="theme-select">Theme</label>
          <select id="theme-select">
            <option value="pink">Pink</option>
            <option value="white">White</option>
            <option value="gray">Gray</option>
            <option value="green">Green</option>
            <option value="blue">Blue</option>
          </select>
        </div>
      </div>

      <div id="sections"></div>

      <button id="add-section-btn" title="New section">+ Section</button>
      <div id="add-section-form" class="hidden">
        <input id="new-section-input" type="text" placeholder="Section name">
        <button id="section-confirm-btn">✓</button>
      </div>

      <div id="hint">Ctrl+Shift+L to show/hide</div>
    </div>

    <div id="col-resizer" title="Drag to resize">
      <button id="col-toggle-btn" title="Show/hide regex column">◀</button>
    </div>

    <div id="regex-col">
      <div id="regex-title">Regex</div>
      <div id="regex-grid"></div>
      <button id="add-regex-btn" title="New regex shortcut">+</button>
      <div id="regex-add-form" class="hidden">
        <input id="regex-label-input" type="text" placeholder="Name" maxlength="12">
        <input id="regex-pattern-input" type="text" placeholder="Regex">
        <button id="regex-confirm-btn">✓</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
