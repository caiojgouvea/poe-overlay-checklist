<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>PoE League Checklist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="panel">
    <div id="header">
      <span id="title">🗡️ League Checklist</span>
      <div id="header-actions">
        <button id="settings-btn" title="Configurações">⚙</button>
        <button id="close-btn" title="Esconder (Ctrl+Shift+L)">✕</button>
      </div>
    </div>

    <div id="settings-panel" class="hidden">
      <label for="character-name-input">Personagem</label>
      <input id="character-name-input" type="text" placeholder="Nome do boneco...">
    </div>

    <div id="sections"></div>

    <div id="add-section-row">
      <input id="new-section-input" type="text" placeholder="Nova sessão...">
      <button id="add-section-btn">+</button>
    </div>

    <div id="hint">Ctrl+Shift+L para mostrar/esconder</div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
