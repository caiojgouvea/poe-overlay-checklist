<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>PoE League Checklist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="panel">
    <div id="header">
      <span id="title">🗡️ League Checklist</span>
      <span id="lock-indicator">🔒</span>
    </div>

    <ul id="list"></ul>

    <div id="add-row">
      <input id="new-item-input" type="text" placeholder="Novo passo...">
      <button id="add-btn">+</button>
    </div>

    <div id="hint">Ctrl+Shift+L para destravar/travar</div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
